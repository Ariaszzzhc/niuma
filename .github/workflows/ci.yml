name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Deno gates: format, lint, type-check, the full test suite, and the
  # network-free end-to-end smoke harness. Mirrors the local gates listed in
  # AGENTS.md.
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      # The full test suite includes TUI/tuikit tests that call into the
      # native cdylib — build it before `deno task test`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/tuikit/native
      - run: deno task build:native
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test
      - run: deno run --allow-all scripts/smoke.ts

  # Rust gates for the tuikit native cdylib.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tuikit/native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/tuikit/native
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
