name: release

# Cutting a release: bump the root deno.json "version", commit, then push a
# matching `v*` tag (e.g. v0.1.0). The verify job refuses mismatched tags, the
# build matrix compiles one binary per target (native cdylib + deno compile +
# binary smoke, all on the matching OS runner), and publish attaches the
# archives plus SHA256SUMS to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag version must match the root deno.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version deno.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "tag ${tag} does not match deno.json version ${manifest}" >&2
            exit 1
          fi
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      # The full test suite includes TUI/tuikit tests that call into the
      # native cdylib — build it before `deno task test`.
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/tuikit/native
      - run: deno task build:native
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test
      - run: deno run --allow-all scripts/smoke.ts

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            asset: niuma-linux-amd64
          - runs-on: macos-14
            asset: niuma-darwin-aarch64
          - runs-on: windows-latest
            asset: niuma-windows-amd64.exe
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/tuikit/native
      # scripts/build.ts builds the cdylib, compiles the CLI, and smoke-runs
      # the binary — each leg is a native build on its target OS.
      - name: Build binary (native + deno compile + smoke)
        run: deno task build
      - name: Package archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p out
          cp dist/niuma out/niuma
          tar -czf "${ASSET}.tar.gz" -C out niuma
          shasum -a 256 "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"
      - name: Package archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/niuma.exe out/niuma.exe
          Compress-Archive -Path out/niuma.exe -DestinationPath "${env:ASSET}.zip" -Force
          "$((Get-FileHash "${env:ASSET}.zip" -Algorithm SHA256).Hash.ToLower())  ${env:ASSET}.zip" |
            Out-File -Encoding ascii "${env:ASSET}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: error
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Collect SHA256SUMS
        run: cat assets/*.sha256 | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            assets/*.tar.gz
            assets/*.zip
            SHA256SUMS
